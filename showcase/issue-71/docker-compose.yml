# docker-compose.yml — Grafana + Loki stack for Pi 4 NIDS
# Tested on Raspberry Pi 4 with Docker 24.x and Compose v2
#
# Usage:
#   docker compose up -d
#   # Grafana → http://<pi-ip>:3000  (admin / admin on first login)
#   # Loki    → http://localhost:3100

version: "3.9"

services:

  loki:
    image: grafana/loki:2.9.4
    container_name: nids_loki
    restart: unless-stopped
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.3.3
    container_name: nids_grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=nids_admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/nids_overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  loki_data:
  grafana_data:
